function issueModal(id){const cur_=S.clients.filter(c=>c.group==='current'),i=id?S.issues.find(x=>x.id===id):null;if(!i&&!cur_.length){toast('Add a current client first');return}
draft=i?structuredClone(i):{id:uid(),cid:(icl!=='All'&&cur_.some(c=>c.id===icl))?icl:cur_[0].id,title:'',start:td(),due:'',status:'In progress',stuck:'',stuckSince:'',isNew:true};mode='issue';
const cs=S.clients.filter(c=>c.group==='current'||c.id===draft.cid).sort((a,b)=>a.name.localeCompare(b.name));
open_(`<div class="pbody"><h2>${draft.isNew?'New issue':'Edit issue'}</h2>
<label>Client<select id="f-cid">${cs.map(c=>`<option value="${c.id}" ${c.id===draft.cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
<label>Issue<input id="f-title" value="${esc(draft.title)}" placeholder="What needs to be completed?"></label>
<div class="g2"><label>Start date<input type="date" id="f-start" value="${draft.start}"></label><label>Due date<input type="date" id="f-due" value="${draft.due}"></label></div>
<label>Status<select id="f-status">${opt(ISS,draft.status)}</select></label>
<label id="whyw" style="display:${draft.status==='Stuck'?'block':'none'}">Why is it stuck?<textarea id="f-why" rows="3" placeholder="Waiting on client, bug, third-party approval…">${esc(draft.stuck)}</textarea></label>
<label>Today's update<textarea id="f-upd" rows="3" placeholder="What moved on this today?">${esc((updFor(draft.id,td())||{}).t||'')}</textarea></label></div>
<div class="acts"><button class="p" data-save>Save</button><button data-close>Cancel</button><span class="sp"></span>${draft.isNew?'':'<button data-del style="color:var(--red)">Delete</button>'}</div>`);$('#f-title').focus()}
function payModal(id){const p=id?S.pays.find(x=>x.id===id):null;if(!p&&!S.clients.length){toast('Add a client first');return}
draft=p?structuredClone(p):{id:uid(),cid:S.clients[0].id,amount:'',due:td(),paid:false,paidOn:'',kind:'Renewal',isNew:true};mode='pay';const cs=[...S.clients].sort((a,b)=>a.name.localeCompare(b.name));
open_(`<div class="pbody"><h2>${draft.isNew?'New payment':'Edit payment'}</h2>
<label>Client<select id="f-cid">${cs.map(c=>`<option value="${c.id}" ${c.id===draft.cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
<div class="g2"><label>Type<select id="f-kind">${opt(KIND,draft.kind)}</select></label><label>Amount (₹)<input type="number" min="0" id="f-amt" value="${draft.amount}"></label>
<label>Due date<input type="date" id="f-due" value="${draft.due}"></label><label class="ck" style="padding-top:22px"><input type="checkbox" id="f-paid" ${draft.paid?'checked':''}>Paid</label></div>
<label id="pdw" style="display:${draft.paid?'block':'none'}">Paid on<input type="date" id="f-pdate" value="${draft.paidOn||td()}"></label></div>
<div class="acts"><button class="p" data-save>Save</button><button data-close>Cancel</button><span class="sp"></span>${draft.isNew?'':'<button data-del style="color:var(--red)">Delete</button>'}</div>`);$('#f-amt').focus()}
function saveModal(){
if(mode==='client'){const n=$('#f-name').value.trim();if(!n){$('#f-name').focus();return toast('Enter the client name')}
if($('#pa-amt').value||$('#pa-paid').checked){const before=dpays.length;addPay();if(dpays.length===before)return}
if($('#b-on').checked&&!$('#b-text').value.trim()){$('#b-text').focus();return toast('Describe what is blocking this client')}
if(!document.querySelector('input[name=f-svc]:checked'))return toast('Tick at least one service');
const wasNew=draft.isNew;Object.assign(draft,{name:n,group:$('#f-grp').value,stage:$('#f-stage').value,products:[...document.querySelectorAll('input[name=f-svc]:checked')].map(x=>x.value),contact:$('#f-con').value.trim(),amount:+$('#f-amt').value||0,cycle:$('#f-cyc').value,notes:$('#f-notes').value,owner:$('#f-own').value.trim(),team:$('#f-team').value});if($('#b-on').checked)draft.bl={on:true,auto:false,cat:$('#b-cat').value,dept:$('#b-dept').value,text:$('#b-text').value.trim(),risk:+$('#b-risk').value||0,due:$('#b-due').value,eta:$('#b-eta').value};else delete draft.bl;delete draft.isNew;
if(wasNew)S.clients.push(draft);else S.clients=S.clients.map(x=>x.id===draft.id?draft:x);S.pays=S.pays.filter(p=>p.cid!==draft.id).concat(dpays)}
else if(mode==='issue'){const t=$('#f-title').value.trim(),du=$('#f-due').value,sd=$('#f-start').value||td(),st=$('#f-status').value,why=$('#f-why').value.trim();
if(!t){$('#f-title').focus();return toast('Give the issue a title')}if(!du){$('#f-due').focus();return toast('Set a due date for the timeline')}if(du<sd)return toast('The due date is before the start date');if(st==='Stuck'&&!why){$('#f-why').focus();return toast('Add why this is stuck')}
Object.assign(draft,{cid:$('#f-cid').value,title:t,start:sd,due:du});setStatus(draft,st,why);const wasNew=draft.isNew;delete draft.isNew;
if(wasNew)S.issues.push(draft);else S.issues=S.issues.map(x=>x.id===draft.id?draft:x);setUpd(draft,$('#f-upd').value)}
else if(mode==='pay'){const a=+$('#f-amt').value;if(!(a>0)){$('#f-amt').focus();return toast('Enter the amount')}if(!$('#f-due').value)return toast('Pick a date');
const wasPaid=draft.paid,paid=$('#f-paid').checked,pd=$('#f-pdate').value||td(),np=Object.assign({},draft,{cid:$('#f-cid').value,kind:$('#f-kind').value,amount:a,due:$('#f-due').value,paid:false,paidOn:''});delete np.isNew;
if(draft.isNew)S.pays.push(np);else S.pays=S.pays.map(x=>x.id===np.id?np:x);let n;if(paid&&!wasPaid)n=setPaid(S.pays,np,true,pd);else if(paid){np.paid=true;np.paidOn=pd}if(n)toast('Next renewal scheduled for '+fdy(n.due))}
closeM();save();render();if(!$('#toast').classList.contains('show'))toast('Saved')}
function delModal(){const m=mode,d=draft;if(m==='client'){if(!confirm('Delete this client with all its payments and issues?'))return;S.clients=S.clients.filter(x=>x.id!==d.id);S.pays=S.pays.filter(p=>p.cid!==d.id);S.issues=S.issues.filter(i=>i.cid!==d.id)}
else if(m==='issue'){if(!confirm('Delete this issue?'))return;S.issues=S.issues.filter(x=>x.id!==d.id)}else{if(!confirm('Delete this payment?'))return;S.pays=S.pays.filter(x=>x.id!==d.id)}closeM();save();render()}
function exportData(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='growthaccel-backup-'+td()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),800);toast('Backup downloaded')}
$('#imp').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.clients))throw 0;if(!confirm('Replace everything in the tracker with this backup?'))return;S=Object.assign({clients:[],issues:[],pays:[],upd:[],set:{}},o);S.set=Object.assign({time:'18:00',done:{},notified:''},S.set);save();render();toast('Backup restored')}catch(x){toast('That file is not a valid backup')}};r.readAsText(f)});
/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target,g=a=>t.closest('['+a+']'),v=a=>g(a).getAttribute(a);
if(g('data-paid')){e.stopPropagation();const p=S.pays.find(x=>x.id===v('data-paid'));if(p){const n=setPaid(S.pays,p,true);save();render();toast(n?'Paid. Next renewal scheduled for '+fdy(n.due):'Marked as paid')}return}
if(g('data-nav')){cur=v('data-nav');q='';fst='All';fpay='All';return render()}
if(g('data-new'))return clientModal(null,GR[cur]?cur:'current');
if(g('data-ng'))return clientModal(null,v('data-ng'));
if(g('data-newi'))return issueModal();if(g('data-newp'))return payModal();
if(g('data-cv')){cview=v('data-cv');return render()}if(g('data-iv')){iview=v('data-iv');return render()}if(g('data-pf')){pst=v('data-pf');return render()}if(g('data-ay')){ayear+=+v('data-ay');return render()}
if(g('data-scope')){dscope=v('data-scope');showAll=false;return render()}if(g('data-hf')){hf=v('data-hf');return render()}if(g('data-all')){showAll=!showAll;return render()}
if(g('data-rep'))return copyText(reportText());if(g('data-print'))return window.print();
if(g('data-export'))return exportData();if(g('data-import'))return $('#imp').click();
if(g('data-eod'))return eod(false);if(g('data-day')){sdate=v('data-day');return render()}if(g('data-today')){sdate=td();return render()}
if(g('data-copy')){const x=sumText(sdate||td());(navigator.clipboard?navigator.clipboard.writeText(x):Promise.reject()).then(()=>toast('Summary copied'),()=>{const a=document.createElement('textarea');a.value=x;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Summary copied')}catch(e){toast('Copy failed')}a.remove()});return}
if(g('data-notif')){if('Notification' in window)Notification.requestPermission().then(()=>render());return}
if(g('data-snooze')){closeM();toast('Reminder in 15 minutes');return}
if(g('data-skip')){S.set.done[td()]=1;closeM();save();render();toast('Skipped for today');return}
if(g('data-eodsave')){const els=[...document.querySelectorAll('#modal .ei')];
for(const el of els){if(el.querySelector('select').value==='Stuck'&&!el.querySelector('.why').value.trim()){el.querySelector('.why').focus();return toast('Add a reason for each stuck issue')}}
els.forEach(el=>{const i=S.issues.find(x=>x.id===el.dataset.eid);if(!i)return;setStatus(i,el.querySelector('select').value,el.querySelector('.why').value.trim());setUpd(i,el.querySelector('textarea').value)});
S.set.done[td()]=1;closeM();save();cur='summary';sdate=td();render();toast('Daily summary is ready');return}
if(g('data-tgl')){const n=dk()?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('ga-theme',n)}catch(e){}applyPal();return render()}
if(g('data-pal')){pal=v('data-pal');try{localStorage.setItem('ga-pal',pal)}catch(e){}applyPal();return render()}
if(g('data-addpay'))return addPay();
if(g('data-ppaid')){const p=dpays.find(x=>x.id===v('data-ppaid'));const n=setPaid(dpays,p,!p.paid);paysUI();if(n)toast('Next renewal scheduled for '+fdy(n.due));return}
if(g('data-rpay')){dpays=dpays.filter(x=>x.id!==v('data-rpay'));return paysUI()}
if(g('data-close')||t.classList.contains('ov'))return closeM();
if(g('data-del'))return delModal();if(g('data-save'))return saveModal();
if(t.closest('#modal'))return;
let c;if(c=g('data-cid'))return clientModal(c.dataset.cid,'current');if(c=g('data-iid'))return issueModal(c.dataset.iid);if(c=g('data-pid'))return payModal(c.dataset.pid)});
document.addEventListener('change',e=>{const t=e.target;
if(t.id==='fst'){fst=t.value;render()}if(t.id==='fpay'){fpay=t.value;render()}if(t.id==='fcl'){icl=t.value;render()}if(t.id==='fis'){ist=t.value;render()}
if(t.id==='sd'&&t.value){sdate=t.value;render()}if(t.id==='set-time'&&t.value){S.set.time=t.value;save();render();toast('Reminder time set to '+t.value)}
if(t.id==='f-grp'){$('#f-stage').innerHTML=opt(STG[t.value],STG[t.value][0])}
if(t.id==='f-status')$('#whyw').style.display=t.value==='Stuck'?'block':'none';
if(t.id==='b-on')$('#bkw').style.display=t.checked?'block':'none';
if(t.id==='f-paid')$('#pdw').style.display=t.checked?'block':'none';
if(t.closest&&t.closest('.ei')&&t.tagName==='SELECT'){const w=t.closest('.ei').querySelector('.why');w.style.display=t.value==='Stuck'?'block':'none';if(t.value==='Stuck')w.focus()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.sc,.li,.card,tr.r,.ur.miss,.gr[data-iid]')){e.preventDefault();e.target.click()}});
let dragId=null;const cs_=e=>e.target.closest&&e.target.closest('.col[data-stage]');
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card');if(c){dragId=c.dataset.cid;e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const c=cs_(e);if(c&&dragId){e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('drop',e=>{const c=cs_(e);if(c&&dragId){e.preventDefault();const cl=S.clients.find(x=>x.id===dragId);if(cl&&cl.stage!==c.dataset.stage){cl.stage=c.dataset.stage;save();render();toast(cl.name+' → '+cl.stage)}}dragId=null});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});
let wasDue=null;
function tick(){const due=dueNow();if(due!==wasDue){wasDue=due;render()}
if(due&&!$('#modal').innerHTML&&Date.now()>=snoozeUntil){if(S.set.notified!==td()){S.set.notified=td();save();try{if(Notification.permission==='granted')new Notification('GrowthAccel: time for your daily update',{body:openIss().length+' open issues need an update.'})}catch(e){}}eod(true)}}
if(migrated){save();setTimeout(()=>toast('Your earlier work items were imported as clients and issues'),600)}
applyPal();render();setInterval(tick,15000);tick();

</script>
</body>
